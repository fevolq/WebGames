name: Lobby checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lobby-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Start production Nginx
        run: |
          docker run --detach --name webgames-ci --publish 127.0.0.1:8080:80 \
            --mount "type=bind,source=$PWD/dist,target=/usr/share/nginx/html,readonly" \
            --mount "type=bind,source=$PWD/.artifacts/nginx/default.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            nginx:stable-alpine
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/ --output /dev/null
      - name: Check deployed routes and all build assets
        run: npm run test:deployment
      - name: Show Nginx logs on failure
        if: failure()
        run: docker logs webgames-ci
      - name: Stop Nginx
        if: always()
        run: docker rm --force webgames-ci
